[proxy]
http_bind = "0.0.0.0:80"
https_bind = "0.0.0.0:443"
cache_dir = "../data/acme"
max_connections = 2048

[[acme_accounts]]
id = "lets-encrypt"
name = "Let's Encrypt 生产账户"
provider = "lets_encrypt"
environment = "production"
email = "admin@example.com"
key_algorithm = "ec256"

# Google Cloud Public CA 的 EAB 凭据在 Google Cloud Console 中创建。
[[acme_accounts]]
id = "google-cloud"
name = "Google Cloud 生产账户"
provider = "google_cloud"
environment = "production"
email = "admin@example.com"
key_algorithm = "rsa2048"
eab_key_id = "replace-with-eab-key-id"
eab_hmac_key = "replace-with-base64url-hmac-key"

# Token 需要 Zone Read 与 DNS Edit 权限，Zone 会按域名自动发现。
[[dns_accounts]]
id = "cloudflare"
name = "Cloudflare 主账户"
provider = "cloudflare"
api_token = "replace-with-scoped-token"

[[dns_accounts]]
id = "aliyun"
name = "阿里云 DNS"
provider = "aliyun"
access_key = "replace-with-access-key"
secret_key = "replace-with-secret-key"

[[certificates]]
id = "site"
name = "公开站点"
domains = ["example.com", "www.example.com"]
acme_account_id = "lets-encrypt"
auto_renew = true

[certificates.validation]
method = "dns_account"
dns_account_id = "cloudflare"

[[certificates]]
id = "wildcard"
name = "内部泛域名"
domains = ["*.internal.example.com"]
acme_account_id = "google-cloud"
auto_renew = false

[certificates.validation]
method = "manual"

[[routes]]
name = "public-site"
host = "example.com"
path_prefix = "/"
upstream = "http://127.0.0.1:3000"
certificate_id = "site"

[[routes]]
name = "api"
host = "example.com"
path_prefix = "/api"
upstream = "http://127.0.0.1:8080"
certificate_id = "site"

[[routes]]
name = "tunnel-service"
host = "service.internal.example.com"
path_prefix = "/"
upstream = "http://127.0.0.1:18080"
certificate_id = "wildcard"
