name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Apply release version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/apply-release-version.mjs
      - name: Verify release versions
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-version.mjs
      - name: Verify installer service files
        run: sh scripts/test-installer-service-files.sh
      - name: Verify installer dependencies
        run: sh scripts/test-installer-dependencies.sh
      - name: Verify installer Web configuration
        run: sh scripts/test-installer-web-config.sh

  command_binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_os: linux
            asset_arch: amd64
            cross: true
            extension: ''
          - runner: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            asset_os: linux
            asset_arch: arm
            cross: true
            extension: ''
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_os: linux
            asset_arch: arm64
            cross: true
            extension: ''
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: mac
            asset_arch: amd64
            cross: false
            extension: ''
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_os: mac
            asset_arch: arm64
            cross: false
            extension: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: amd64
            cross: false
            extension: '.exe'
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_os: windows
            asset_arch: arm64
            cross: false
            extension: '.exe'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Apply release version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/apply-release-version.mjs
      - name: Build Linux binaries
        if: matrix.cross == true
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: '--locked --release -p gaterust-server --all-features'
      - name: Build native binaries
        if: matrix.cross == false
        run: cargo build --locked --release -p gaterust-server --all-features --target ${{ matrix.target }}
      - name: Stage command binaries
        shell: bash
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ASSET_OS: ${{ matrix.asset_os }}
          EXTENSION: ${{ matrix.extension }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          server="target/$TARGET/release/gaterust-server$EXTENSION"
          test -f "$server"
          cp "$server" "dist/gaterust_server_${version}_${ASSET_OS}_${ASSET_ARCH}${EXTENSION}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-binaries-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/gaterust_server_*
          if-no-files-found: error

  desktop_clients:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: amd64
            bundle: appimage
            package_glob: '*.AppImage'
            extension: '.AppImage'
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: arm64
            bundle: appimage
            package_glob: '*.AppImage'
            extension: '.AppImage'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: mac
            asset_arch: amd64
            bundle: dmg
            package_glob: '*.dmg'
            extension: '.dmg'
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_os: mac
            asset_arch: arm64
            bundle: dmg
            package_glob: '*.dmg'
            extension: '.dmg'
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: amd64
            bundle: nsis
            package_glob: '*-setup.exe'
            extension: '.exe'
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_os: windows
            asset_arch: arm64
            bundle: nsis
            package_glob: '*-setup.exe'
            extension: '.exe'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Apply release version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/apply-release-version.mjs
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install desktop dependencies
        run: pnpm --dir client install --frozen-lockfile
      - name: Build desktop client
        run: pnpm --dir client exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Stage desktop package
        shell: bash
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ASSET_OS: ${{ matrix.asset_os }}
          BUNDLE: ${{ matrix.bundle }}
          EXTENSION: ${{ matrix.extension }}
          PACKAGE_GLOB: ${{ matrix.package_glob }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          packages=(target/"$TARGET"/release/bundle/"$BUNDLE"/$PACKAGE_GLOB)
          test "${#packages[@]}" -eq 1
          mkdir -p dist
          cp "${packages[0]}" "dist/gaterust_client_${version}_${ASSET_OS}_${ASSET_ARCH}${EXTENSION}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-clients-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/gaterust_client_*
          if-no-files-found: error

  installer:
    needs: command_binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Apply release version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/apply-release-version.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: command-binaries-linux-*
          path: installer-input
          merge-multiple: true
      - name: Build Web UI
        working-directory: web
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Package installer assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p installer-dist

          for spec in x86_64:amd64 aarch64:arm64; do
            arch="${spec%%:*}"
            release_arch="${spec#*:}"
            target="$arch-unknown-linux-musl"
            stage="$(mktemp -d)"
            mkdir -p "$stage/config"

            install -m 0755 \
              "installer-input/gaterust_server_${version}_linux_${release_arch}" \
              "$stage/gaterust-server"
            cp -a web/dist "$stage/web"
            install -m 0644 scripts/gaterust.service "$stage/gaterust.service"
            install -m 0755 scripts/gaterust.openrc "$stage/gaterust.openrc"
            sed \
              's#../certs/server.pem#/etc/gaterust/tunnel/server.pem#; s#../certs/server-key.pem#/etc/gaterust/tunnel/server-key.pem#' \
              config/server.example.toml > "$stage/config/server.example.toml"
            sed \
              's#../data/acme#/var/lib/gaterust/proxy/acme#' \
              config/proxy.example.toml > "$stage/config/proxy.example.toml"
            sed \
              's#../web/dist#/usr/local/lib/gaterust/web#' \
              config/web.example.toml > "$stage/config/web.example.toml"
            printf '%s\n' "$GITHUB_REF_NAME" > "$stage/VERSION"
            printf '%s\n' "$target" > "$stage/TARGET"
            tar -C "$stage" -czf "installer-dist/gaterust-$arch-linux-musl.tar.gz" .
            rm -rf "$stage"
          done

          install -m 0755 scripts/gaterust.sh installer-dist/gaterust.sh
          (
            cd installer-dist
            sha256sum \
              gaterust-x86_64-linux-musl.tar.gz \
              gaterust-aarch64-linux-musl.tar.gz \
              gaterust.sh > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Verify installer assets
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            archive="installer-dist/gaterust-$arch-linux-musl.tar.gz"
            target="$arch-unknown-linux-musl"
            archive_files="$(mktemp)"
            tar -tzf "$archive" > "$archive_files"
            test "$(tar -xOf "$archive" ./VERSION)" = "$GITHUB_REF_NAME"
            test "$(tar -xOf "$archive" ./TARGET)" = "$target"
            for path in \
              ./gaterust-server \
              ./gaterust.service \
              ./gaterust.openrc \
              ./config/server.example.toml \
              ./config/proxy.example.toml \
              ./config/web.example.toml \
              ./web/ \
              ./VERSION \
              ./TARGET; do
              grep -Fqx "$path" "$archive_files"
            done
            rm -f "$archive_files"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-assets
          path: |
            installer-dist/gaterust-x86_64-linux-musl.tar.gz
            installer-dist/gaterust-aarch64-linux-musl.tar.gz
            installer-dist/gaterust.sh
            installer-dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs:
      - command_binaries
      - desktop_clients
      - installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: command-binaries-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-clients-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-assets
          path: dist
      - name: Verify release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 17
          for target in linux_amd64 linux_arm linux_arm64 mac_amd64 mac_arm64; do
            test -f "dist/gaterust_server_${version}_${target}"
          done
          for target in windows_amd64 windows_arm64; do
            test -f "dist/gaterust_server_${version}_${target}.exe"
          done
          for target in linux_amd64 linux_arm64; do
            test -f "dist/gaterust_client_${version}_${target}.AppImage"
          done
          for target in mac_amd64 mac_arm64; do
            test -f "dist/gaterust_client_${version}_${target}.dmg"
          done
          for target in windows_amd64 windows_arm64; do
            test -f "dist/gaterust_client_${version}_${target}.exe"
          done
          test -f dist/gaterust-x86_64-linux-musl.tar.gz
          test -f dist/gaterust-aarch64-linux-musl.tar.gz
          test -f dist/gaterust.sh
          test -f dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Generate release checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum gaterust* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist/*
      - name: Remove obsolete release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r asset; do
            if [[ ! -f "dist/$asset" ]]; then
              gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
            fi
          done < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
