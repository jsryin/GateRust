name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Verify release versions
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-version.mjs

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_os: linux
            asset_arch: amd64
            cross: true
            extension: ''
          - runner: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            asset_os: linux
            asset_arch: arm
            cross: true
            extension: ''
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_os: linux
            asset_arch: arm64
            cross: true
            extension: ''
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: mac
            asset_arch: amd64
            cross: false
            extension: ''
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_os: mac
            asset_arch: arm64
            cross: false
            extension: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: amd64
            cross: false
            extension: '.exe'
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_os: windows
            asset_arch: arm64
            cross: false
            extension: '.exe'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Build Linux binaries
        if: matrix.cross == true
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: '--locked --release -p gaterust-server -p gaterust-client --all-features'
      - name: Build native binaries
        if: matrix.cross == false
        run: cargo build --locked --release -p gaterust-server -p gaterust-client --all-features --target ${{ matrix.target }}
      - name: Stage binaries
        shell: bash
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ASSET_OS: ${{ matrix.asset_os }}
          EXTENSION: ${{ matrix.extension }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for component in server client; do
            source="target/$TARGET/release/gaterust-$component$EXTENSION"
            destination="dist/gaterust_${component}_${version}_${ASSET_OS}_${ASSET_ARCH}${EXTENSION}"
            test -f "$source"
            cp "$source" "$destination"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/gaterust_*
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 14
          for target in linux_amd64 linux_arm linux_arm64 mac_amd64 mac_arm64; do
            test -f "dist/gaterust_server_${version}_${target}"
            test -f "dist/gaterust_client_${version}_${target}"
          done
          for target in windows_amd64 windows_arm64; do
            test -f "dist/gaterust_server_${version}_${target}.exe"
            test -f "dist/gaterust_client_${version}_${target}.exe"
          done
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist/gaterust_*
      - name: Remove obsolete release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r asset; do
            if [[ ! -f "dist/$asset" ]]; then
              gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
            fi
          done < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
